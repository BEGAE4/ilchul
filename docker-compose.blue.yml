services:
  ilchul-backend-blue:
    image: ${BACKEND_IMAGE}
    container_name: ilchul-backend-blue
    env_file:
      - .env
    environment:
      - SERVER_PORT=${BACKEND_SERVER_PORT}
    restart: unless-stopped
    networks:
      - ilchul-network
      - shared-infra
      - monitoring_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${BACKEND_SERVER_PORT}/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s

  ilchul-frontend-blue:
    image: ${FRONTEND_IMAGE}
    container_name: ilchul-frontend-blue
    user: nextjs
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1001,gid=65533,mode=0700
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=${FRONTEND_SERVER_PORT}
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://ilchul-backend-blue:${BACKEND_SERVER_PORT}
    depends_on:
      - ilchul-backend-blue
    restart: unless-stopped
    networks:
      - ilchul-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${FRONTEND_SERVER_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  ilchul-network:
    external: true
    name: ilchul-network
  shared-infra:
    external: true
    name: shared-infra
  monitoring_net:
    external: true
    name: monitoring_net
