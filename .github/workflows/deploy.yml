name: Blue-Green Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ilchul-production
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      repo_owner: ${{ steps.values.outputs.repo_owner }}
      actor: ${{ steps.values.outputs.actor }}
      git_sha: ${{ steps.values.outputs.git_sha }}
    steps:
      - name: Set image metadata
        id: values
        shell: bash
        run: |
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR,,}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: yarn build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ needs.metadata.outputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: frontend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ needs.metadata.outputs.repo_owner }}/ilchul-frontend:${{ needs.metadata.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Test and build backend
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ needs.metadata.outputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ needs.metadata.outputs.repo_owner }}/ilchul-backend:${{ needs.metadata.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-target:
    needs: [metadata, build-frontend, build-backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test scoped image cleanup
        run: bash scripts/prune-deployment-images.test.sh

      - name: Check host readiness before copying deployment files
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          script: sudo -n /usr/local/sbin/ilchul-vault-preflight --new-deployment

      - name: Copy deployment files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          source: docker-compose.blue.yml,docker-compose.green.yml,docker-compose.nginx.yml,nginx,rollback.sh,scripts/prune-deployment-images.sh
          target: /home/begae/ilchul

      - name: Deploy inactive environment
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        env:
          REPO_OWNER: ${{ needs.metadata.outputs.repo_owner }}
          ACTOR: ${{ needs.metadata.outputs.actor }}
          GIT_SHA: ${{ needs.metadata.outputs.git_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          envs: REPO_OWNER,ACTOR,GIT_SHA,GHCR_TOKEN
          script: |
            set -eu
            PROJECT_PATH="/home/begae/ilchul"
            cd "$PROJECT_PATH"

            sudo -n /usr/local/sbin/ilchul-vault-preflight --new-deployment
            # Only allowlisted non-secret values; never source a production .env in the shell.
            export COMPOSE_ENV_FILES=/etc/ilchul/runtime-public.env
            export FRONTEND_IMAGE="ghcr.io/${REPO_OWNER}/ilchul-frontend:${GIT_SHA}"
            export BACKEND_IMAGE="ghcr.io/${REPO_OWNER}/ilchul-backend:${GIT_SHA}"

            if [ ! -f current_environment.txt ]; then
              echo 'Active color is unknown; deployment blocked.'
              exit 1
            fi

            CURRENT_ENV=$(tr -d '[:space:]' < current_environment.txt)
            case "$CURRENT_ENV" in blue|green) ;; *) exit 1 ;; esac
            if [ "$CURRENT_ENV" = "blue" ]; then
              TARGET_ENV="green"
            else
              TARGET_ENV="blue"
            fi

            echo "$TARGET_ENV" > target_environment.txt
            echo "$CURRENT_ENV" > previous_environment.txt

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            docker network inspect shared-infra >/dev/null

            # MinIO policy/account administration is a separately reviewed host operation.
            # Reload never stops dependent apps; a failed fetch retains the last generation.
            sudo -n systemctl reload ilchul-secrets.service

            install -d -m 0755 nginx/runtime
            install -m 0644 "nginx/upstreams/${CURRENT_ENV}.conf" nginx/runtime/active.conf.new
            mv nginx/runtime/active.conf.new nginx/runtime/active.conf
            docker compose -f docker-compose.nginx.yml config --quiet
            docker compose -f docker-compose.nginx.yml pull
            docker compose -f docker-compose.nginx.yml up -d

            for attempt in $(seq 1 30); do
              GATEWAY_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ilchul-nginx)
              if [ "$GATEWAY_HEALTH" = "healthy" ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo 'Gateway failed health validation; inspect restricted host logs.'
                exit 1
              fi
              echo "Waiting for Ilchul Nginx gateway: ${GATEWAY_HEALTH} (${attempt}/30)"
              sleep 2
            done

            docker exec ilchul-nginx nginx -t
            docker exec ilchul-nginx nginx -s reload
            curl --fail --silent --show-error \
              --retry 10 \
              --retry-delay 1 \
              --retry-connrefused \
              -H "Host: il-chul.com" \
              -H "X-Real-IP: 127.0.0.1" \
              -H "X-Forwarded-For: 127.0.0.1" \
              -H "X-Forwarded-Proto: https" \
              http://127.0.0.1:18090/intro >/dev/null

            CURRENT_BACKEND_CONTAINER="ilchul-backend-${CURRENT_ENV}"
            CURRENT_FRONTEND_CONTAINER="ilchul-frontend-${CURRENT_ENV}"
            if docker inspect "$CURRENT_BACKEND_CONTAINER" "$CURRENT_FRONTEND_CONTAINER" >/dev/null 2>&1; then
              bash scripts/prune-deployment-images.sh snapshot \
                .deploy-image-state.tsv \
                "ghcr.io/${REPO_OWNER}/ilchul-backend=$CURRENT_BACKEND_CONTAINER" \
                "ghcr.io/${REPO_OWNER}/ilchul-frontend=$CURRENT_FRONTEND_CONTAINER"
            else
              rm -f .deploy-image-state.tsv
              echo 'One or more previous color containers are absent; image cleanup state was not created.'
            fi

            docker compose -f "docker-compose.${TARGET_ENV}.yml" config --quiet
            docker compose -f "docker-compose.${TARGET_ENV}.yml" pull
            # Keep the rollback window open even if target startup or traffic switching fails.
            # Only an operator closes it after reviewing application checks and rollback state.
            (umask 077; set -C; printf '{"sha":"%s","previous":"%s","target":"%s"}\n' \
              "$GIT_SHA" "$CURRENT_ENV" "$TARGET_ENV" > vault-acceptance-pending.json)
            sudo -n /usr/local/sbin/ilchul-vault-migrate "$BACKEND_IMAGE"
            docker compose -f "docker-compose.${TARGET_ENV}.yml" up -d

            BACKEND_CONTAINER="ilchul-backend-${TARGET_ENV}"
            FRONTEND_CONTAINER="ilchul-frontend-${TARGET_ENV}"
            for attempt in $(seq 1 30); do
              BACKEND_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$BACKEND_CONTAINER")
              FRONTEND_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FRONTEND_CONTAINER")
              if [ "$BACKEND_HEALTH" = "healthy" ] && [ "$FRONTEND_HEALTH" = "healthy" ] \
                && docker exec "$BACKEND_CONTAINER" sh -lc 'wget --quiet --spider "http://127.0.0.1:${SERVER_PORT}/actuator/health"' \
                && docker exec "$FRONTEND_CONTAINER" sh -lc 'wget --quiet --spider "http://127.0.0.1:${PORT}/intro"'; then
                exit 0
              fi
              echo "Waiting for ${TARGET_ENV}: backend=${BACKEND_HEALTH}, frontend=${FRONTEND_HEALTH} (${attempt}/30)"
              sleep 5
            done

            docker compose -f "docker-compose.${TARGET_ENV}.yml" ps
            echo 'Target failed health validation; inspect restricted host logs.'
            exit 1

  switch-traffic:
    needs: [metadata, deploy-target]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Switch traffic and smoke test
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        env:
          REPO_OWNER: ${{ needs.metadata.outputs.repo_owner }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          envs: REPO_OWNER
          script: |
            set -eu
            PROJECT_PATH="/home/begae/ilchul"
            ILCHUL_NGINX="ilchul-nginx"
            cd "$PROJECT_PATH"
            sudo -n /usr/local/sbin/ilchul-vault-preflight

            TARGET_ENV=$(tr -d '[:space:]' < target_environment.txt)
            CURRENT_ENV=$(tr -d '[:space:]' < previous_environment.txt)
            case "$TARGET_ENV:$CURRENT_ENV" in blue:green|green:blue) ;; *) exit 1 ;; esac
            ACTIVE_CONFIG="$PROJECT_PATH/nginx/runtime/active.conf"

            activate_environment() {
              active_environment=$1
              source_config="$PROJECT_PATH/nginx/upstreams/${active_environment}.conf"
              install -m 0644 "$source_config" "${ACTIVE_CONFIG}.new"
              mv "${ACTIVE_CONFIG}.new" "$ACTIVE_CONFIG"
              docker exec "$ILCHUL_NGINX" nginx -t || return 1
              docker exec "$ILCHUL_NGINX" nginx -s reload || return 1
            }

            if ! activate_environment "$TARGET_ENV"; then
              echo "Nginx config switch failed; restoring ${CURRENT_ENV}"
              activate_environment "$CURRENT_ENV"
              exit 1
            fi

            FRONTEND_STATUS=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' https://il-chul.com/intro) || FRONTEND_STATUS=000
            AUTH_STATUS=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' https://il-chul.com/api/plan/1) || AUTH_STATUS=000
            if [ "$FRONTEND_STATUS" != "200" ] || [ "$AUTH_STATUS" != "401" ]; then
              echo "Smoke test failed: frontend=${FRONTEND_STATUS}, unauthenticated_api=${AUTH_STATUS}"
              activate_environment "$CURRENT_ENV"
              exit 1
            fi

            echo "$TARGET_ENV" > current_environment.txt
            echo 'Previous color retained. Verify login/refresh/upload/delete before operator retirement.'

            if [ -f .deploy-image-state.tsv ]; then
              bash scripts/prune-deployment-images.sh cleanup \
                .deploy-image-state.tsv \
                "ghcr.io/${REPO_OWNER}/ilchul-backend=ilchul-backend-${TARGET_ENV}" \
                "ghcr.io/${REPO_OWNER}/ilchul-frontend=ilchul-frontend-${TARGET_ENV}"
            else
              echo 'Image cleanup skipped: no previous deployment state.'
            fi
