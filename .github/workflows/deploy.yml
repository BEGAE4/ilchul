name: Blue-Green Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      repo_owner: ${{ steps.values.outputs.repo_owner }}
      actor: ${{ steps.values.outputs.actor }}
      git_sha: ${{ steps.values.outputs.git_sha }}
    steps:
      - name: Set image metadata
        id: values
        shell: bash
        run: |
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR,,}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: yarn build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ needs.metadata.outputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: frontend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ needs.metadata.outputs.repo_owner }}/ilchul-frontend:${{ needs.metadata.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Test and build backend
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ needs.metadata.outputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: backend
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ needs.metadata.outputs.repo_owner }}/ilchul-backend:${{ needs.metadata.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-target:
    needs: [metadata, build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare backend runtime environment
        env:
          RUNTIME_ENV_FILE: ${{ secrets.ENV_FILE }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$RUNTIME_ENV_FILE" > .env.deploy
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> .env.deploy

      - name: Copy deployment files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          source: docker-compose.blue.yml,docker-compose.green.yml,rollback.sh,.env.deploy
          target: /home/begae/ilchul

      - name: Deploy inactive environment
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        env:
          REPO_OWNER: ${{ needs.metadata.outputs.repo_owner }}
          ACTOR: ${{ needs.metadata.outputs.actor }}
          GIT_SHA: ${{ needs.metadata.outputs.git_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          envs: REPO_OWNER,ACTOR,GIT_SHA,GHCR_TOKEN
          script: |
            set -eu
            PROJECT_PATH="/home/begae/ilchul"
            cd "$PROJECT_PATH"

            if [ ! -f current_environment.txt ]; then
              echo "blue" > current_environment.txt
            fi

            CURRENT_ENV=$(tr -d '[:space:]' < current_environment.txt)
            if [ "$CURRENT_ENV" = "blue" ]; then
              TARGET_ENV="green"
              BACKEND_PORT="8082"
              FRONTEND_PORT="3002"
            else
              TARGET_ENV="blue"
              BACKEND_PORT="8081"
              FRONTEND_PORT="3001"
            fi

            echo "$TARGET_ENV" > target_environment.txt
            echo "$CURRENT_ENV" > previous_environment.txt

            mv .env.deploy .env
            cat << ENV_EOF >> .env
            FRONTEND_IMAGE=ghcr.io/${REPO_OWNER}/ilchul-frontend:${GIT_SHA}
            BACKEND_IMAGE=ghcr.io/${REPO_OWNER}/ilchul-backend:${GIT_SHA}
            ENV_EOF
            chmod 600 .env

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker compose -f "docker-compose.${TARGET_ENV}.yml" config --quiet
            docker compose -f "docker-compose.${TARGET_ENV}.yml" pull
            docker compose -f "docker-compose.${TARGET_ENV}.yml" up -d

            BACKEND_CONTAINER="ilchul-backend-${TARGET_ENV}"
            FRONTEND_CONTAINER="ilchul-frontend-${TARGET_ENV}"
            for attempt in $(seq 1 30); do
              BACKEND_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$BACKEND_CONTAINER")
              FRONTEND_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FRONTEND_CONTAINER")
              if [ "$BACKEND_HEALTH" = "healthy" ] && [ "$FRONTEND_HEALTH" = "healthy" ] \
                && curl --fail --silent --show-error "http://127.0.0.1:${BACKEND_PORT}/actuator/health" >/dev/null \
                && curl --fail --silent --show-error "http://127.0.0.1:${FRONTEND_PORT}/intro" >/dev/null; then
                exit 0
              fi
              echo "Waiting for ${TARGET_ENV}: backend=${BACKEND_HEALTH}, frontend=${FRONTEND_HEALTH} (${attempt}/30)"
              sleep 5
            done

            docker compose -f "docker-compose.${TARGET_ENV}.yml" ps
            docker logs --tail 100 "$BACKEND_CONTAINER" || true
            docker logs --tail 100 "$FRONTEND_CONTAINER" || true
            exit 1

  switch-traffic:
    needs: deploy-target
    runs-on: ubuntu-latest
    steps:
      - name: Switch traffic and smoke test
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          script: |
            set -eu
            PROJECT_PATH="/home/begae/ilchul"
            GLOBAL_NGINX="nginx"
            cd "$PROJECT_PATH"

            TARGET_ENV=$(tr -d '[:space:]' < target_environment.txt)
            CURRENT_ENV=$(tr -d '[:space:]' < previous_environment.txt)
            TARGET_CONFIG="/etc/nginx/conf.d/ilchul/ilchul-${TARGET_ENV}.conf"
            CURRENT_CONFIG="/etc/nginx/conf.d/ilchul/ilchul-${CURRENT_ENV}.conf"
            ACTIVE_CONFIG="/etc/nginx/conf.d/ilchul/ilchul-active-env.conf"

            docker exec "$GLOBAL_NGINX" nginx -t
            docker exec "$GLOBAL_NGINX" ln -sf "$TARGET_CONFIG" "$ACTIVE_CONFIG"
            docker exec "$GLOBAL_NGINX" nginx -t
            docker exec "$GLOBAL_NGINX" nginx -s reload

            FRONTEND_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' https://il-chul.com/intro)
            AUTH_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' https://il-chul.com/api/plan/1)
            if [ "$FRONTEND_STATUS" != "200" ] || [ "$AUTH_STATUS" != "401" ]; then
              echo "Smoke test failed: frontend=${FRONTEND_STATUS}, unauthenticated_api=${AUTH_STATUS}"
              docker exec "$GLOBAL_NGINX" ln -sf "$CURRENT_CONFIG" "$ACTIVE_CONFIG"
              docker exec "$GLOBAL_NGINX" nginx -t
              docker exec "$GLOBAL_NGINX" nginx -s reload
              exit 1
            fi

            echo "$TARGET_ENV" > current_environment.txt
            docker compose -f "docker-compose.${CURRENT_ENV}.yml" stop
