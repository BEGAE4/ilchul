name: Validate PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - working-directory: backend
        run: bash ./gradlew clean build --no-daemon
      - name: Host deployment contracts
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_vault*.py'
          bash -n rollback.sh
          bash scripts/prune-deployment-images.test.sh
      - name: Set up ARM64 emulation for production image validation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Build ARM64 image and verify profiler and migration entrypoints
        run: |
          docker build --platform linux/arm64 --tag ilchul-vault-pr-validation backend
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_profiler_image.py ilchul-vault-pr-validation
          status=0
          output=$(docker run --rm --platform linux/arm64 --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=0:0 --entrypoint java \
            ilchul-vault-pr-validation -jar /app/app.jar --ilchul-migrate 2>&1) || status=$?
          test "$status" -eq 1
          test "$output" = ILCHUL_MIGRATION_FAILED
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - working-directory: frontend
        run: yarn install --frozen-lockfile
      - run: node --test scripts/vault-compose.test.mjs
      - working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid/api
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: test-public-client-id
        run: yarn build
