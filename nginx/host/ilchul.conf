upstream ilchul_gateway {
    server 127.0.0.1:18090;
    keepalive 16;
}

server {
    listen 80;
    server_name il-chul.com;
    client_max_body_size 90M;
    error_page 413 = @payload_too_large;

    location @payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"status":413,"message":"요청 크기는 90MB를 초과할 수 없습니다."}';
    }

    location / {
        proxy_pass http://ilchul_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
