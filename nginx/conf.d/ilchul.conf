server {
    listen 80;
    server_name il-chul.com;
    client_max_body_size 90M;
    error_page 413 = @payload_too_large;

    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/runtime/active.conf;

    location @payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"status":413,"message":"요청 크기는 90MB를 초과할 수 없습니다."}';
    }

    location / {
        proxy_pass $ilchul_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api {
        proxy_pass $ilchul_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /oauth2 {
        proxy_pass $ilchul_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /login/oauth2 {
        proxy_pass $ilchul_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /swagger-ui {
        return 301 /swagger-ui/index.html;
    }

    location = /swagger-ui/ {
        return 301 /swagger-ui/index.html;
    }

    location /swagger-ui {
        proxy_pass $ilchul_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /v3/api-docs {
        proxy_pass $ilchul_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
