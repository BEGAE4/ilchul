services:
  ilchul-backend-green:
    image: ${BACKEND_IMAGE}
    container_name: ilchul-backend-green
    ports:
      - "8082:${BACKEND_SERVER_PORT}"
    env_file:
      - .env
    environment:
      - SERVER_PORT=${BACKEND_SERVER_PORT}
    restart: unless-stopped
    networks:
      - ilchul-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${BACKEND_SERVER_PORT}/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s

  ilchul-frontend-green:
    image: ${FRONTEND_IMAGE}
    container_name: ilchul-frontend-green
    ports:
      - "3002:${FRONTEND_SERVER_PORT}"
    env_file:
      - .env
    environment:
      - PORT=${FRONTEND_SERVER_PORT}
    depends_on:
      - ilchul-backend-green
    restart: unless-stopped
    networks:
      - ilchul-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${FRONTEND_SERVER_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  ilchul-network:
    external: true
    name: ilchul-network