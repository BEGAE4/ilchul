services:
  ilchul-backend-green:
    image: ${BACKEND_IMAGE}
    container_name: ilchul-backend-green
    environment:
      ILCHUL_RUNTIME_MODE: vault
      SERVER_PORT: ${BACKEND_SERVER_PORT:?public configuration required}
      MYSQL_DRIVER: ${MYSQL_DRIVER:?public configuration required}
      MYSQL_URL: ${MYSQL_URL:?public configuration required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?public configuration required}
      REDIS_DB: ${REDIS_DB:?public configuration required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-ilchul-admin}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:?public configuration required}
      OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:?public configuration required}
      OAUTH_KAKAO_REDIRECT_URI: ${OAUTH_KAKAO_REDIRECT_URI:?public configuration required}
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:?public configuration required}
      OAUTH_NAVER_REDIRECT_URI: ${OAUTH_NAVER_REDIRECT_URI:?public configuration required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?public configuration required}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?public configuration required}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:?public configuration required}
      STORAGE_REGION: ${STORAGE_REGION:?public configuration required}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:?public configuration required}
      AWS_EC2_METADATA_DISABLED: "true"
    group_add:
      - ${ILCHUL_SECRET_GID:?dedicated secret group required}
    volumes:
      - type: bind
        source: /run/oci-service-secrets/ilchul-backend
        target: /run/oci-service-secrets/ilchul-backend
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      # Pyroscope 0.12 extracts its native library here; keep the rest of /tmp noexec.
      - /tmp/spring-pyroscope:rw,exec,nosuid,nodev,size=16m,uid=1001,gid=1001,mode=0700
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Host systemd starts this color only after tmpfs secrets have been published.
    restart: "no"
    networks:
      - ilchul-network
      - shared-infra
      - monitoring_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${BACKEND_SERVER_PORT}/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s

  ilchul-frontend-green:
    image: ${FRONTEND_IMAGE}
    container_name: ilchul-frontend-green
    user: nextjs
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1001,gid=65533,mode=0700
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=${FRONTEND_SERVER_PORT}
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://ilchul-backend-green:${BACKEND_SERVER_PORT}
    depends_on:
      - ilchul-backend-green
    restart: "no"
    networks:
      - ilchul-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${FRONTEND_SERVER_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  ilchul-network:
    external: true
    name: ilchul-network
  shared-infra:
    external: true
    name: shared-infra
  monitoring_net:
    external: true
    name: monitoring_net
